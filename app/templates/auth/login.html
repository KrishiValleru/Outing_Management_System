<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campus Outing Management</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Campus Outing</h1>

            <p class="subtitle">
                Management System
            </p>

            <form method="POST">

                <label for="role">
                    Login as
                </label>

                <select
                    name="role"
                    id="role"
                    required
                >

                    <option value="">
                        Select role
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="parent">
                        Parent
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}

        </div>

    </div>

</body>

</html>
